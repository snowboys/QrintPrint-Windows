name: Build Windows executable

on:
  push:
    branches:
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and self-test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean qrintprint.spec

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\dist\QrintPrint.exe" `
            -ArgumentList "--selftest" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "QrintPrint.exe self-test exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path ".\dist\data\selftest.ok")) {
            throw "QrintPrint.exe did not create dist/data/selftest.ok"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\QrintPrint.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  QrintPrint.exe" | Set-Content ".\dist\QrintPrint.exe.sha256" -Encoding ascii

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: QrintPrint-Windows-${{ github.run_number }}
          path: |
            dist/QrintPrint.exe
            dist/QrintPrint.exe.sha256
          if-no-files-found: error
          retention-days: 14
